<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="1100" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
  </defs>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#222">Ogni apparecchio ripete i comandi ai vicini: nessun gateway obbligatorio</text>

  <!-- app e bridge -->
  <rect x="150" y="70" width="260" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="280" y="96" text-anchor="middle" font-weight="bold" fill="#222">App su smartphone</text>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#555">pagina web, configura e comanda</text>
  <rect x="690" y="70" width="260" height="60" rx="8" fill="#fff" stroke="#888" stroke-dasharray="6 4"/>
  <text x="820" y="96" text-anchor="middle" font-weight="bold" fill="#222">Bridge DMX opzionale</text>
  <text x="820" y="116" text-anchor="middle" font-size="12" fill="#555">console DMX/Art-Net/sACN, internet</text>

  <g fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M110 132V218" marker-start="url(#a)" marker-end="url(#a)" transform="translate(0,0)"/>
    <path d="M990 132V218" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <path d="M150 100H110V132" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M950 100H990V132" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="122" y="180" font-size="12" fill="#555">Wi-Fi</text>
  <text x="978" y="180" text-anchor="end" font-size="12" fill="#555">ESP-NOW</text>

  <!-- collegamenti tra vicini -->
  <g stroke="#555" stroke-width="2">
    <line x1="190" y1="250" x2="220" y2="250"/>
    <line x1="410" y1="250" x2="440" y2="250"/>
    <line x1="630" y1="250" x2="660" y2="250"/>
    <line x1="850" y1="250" x2="880" y2="250"/>
  </g>
  <!-- percorsi alternativi -->
  <g fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 4">
    <path d="M110 282C110 340 530 340 530 282"/>
    <path d="M330 282C330 360 750 360 750 282"/>
    <path d="M550 282C550 340 970 340 970 282"/>
  </g>

  <!-- nodi -->
  <rect x="30" y="220" width="160" height="60" rx="8" fill="#e6f5fc" stroke="#22A8DD" stroke-width="2.5"/>
  <text x="110" y="246" text-anchor="middle" font-weight="bold" fill="#222">Nodo 1</text>
  <text x="110" y="266" text-anchor="middle" font-size="12" fill="#222">coordinatore</text>
  <rect x="220" y="220" width="190" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="315" y="246" text-anchor="middle" font-weight="bold" fill="#222">Nodo 2</text>
  <text x="315" y="266" text-anchor="middle" font-size="12" fill="#555">ripete ai vicini</text>
  <rect x="440" y="220" width="190" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="535" y="246" text-anchor="middle" font-weight="bold" fill="#222">Nodo 3</text>
  <text x="535" y="266" text-anchor="middle" font-size="12" fill="#555">ripete ai vicini</text>
  <rect x="660" y="220" width="190" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="755" y="246" text-anchor="middle" font-weight="bold" fill="#222">Nodo 4</text>
  <text x="755" y="266" text-anchor="middle" font-size="12" fill="#555">ripete ai vicini</text>
  <rect x="880" y="220" width="190" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="975" y="246" text-anchor="middle" font-weight="bold" fill="#222">Nodo N</text>
  <text x="975" y="266" text-anchor="middle" font-size="12" fill="#555">ripete ai vicini</text>

  <text x="550" y="385" text-anchor="middle" font-size="13" fill="#555">percorsi alternativi: se un nodo si spegne, il messaggio passa dagli altri</text>
  <text x="30" y="425" font-size="13" fill="#555">Ogni nodo ripete un comando una sola volta; il coordinatore tiene orologio e calendario.</text>
  <text x="30" y="447" font-size="13" fill="#555">Tutti gli apparecchi montano la stessa scheda e lo stesso firmware (ESP32-C5, ESP-NOW a 2,4 GHz).</text>
</svg>
